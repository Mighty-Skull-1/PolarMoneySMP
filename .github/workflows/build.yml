name: Build plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build jar
        run: mvn -B -q package

      # PolarMoneySMP.jar is the main download. WillyMoneySMP.jar is the same file, kept so old links still work.
      - name: Rename jar
        run: |
          cp target/PolarMoneySMP-*.jar PolarMoneySMP.jar
          cp target/PolarMoneySMP-*.jar WillyMoneySMP.jar

      # Always replaces the "latest" release, so the newest jar is at:
      # https://github.com/Mighty-Skull-1/PolarMoneySMP/releases/latest/download/PolarMoneySMP.jar
      - name: Publish latest build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: "Built from ${{ github.sha }}. Download PolarMoneySMP.jar and put it in the server's plugins folder (WillyMoneySMP.jar is the same file, for old links). Remove any older WillyMoneySMP or PolarMoneySMP jar first."
          make_latest: true
          files: |
            PolarMoneySMP.jar
            WillyMoneySMP.jar
