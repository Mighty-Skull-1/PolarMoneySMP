name: WillyMoneySMP
version: 3.5.1
main: me.moneysmp.MoneySMP
api-version: 1.20
authors: [Jelani, Willy]
description: Full-featured tournament engine with Phase controls, Capture Points, Interactive GUI Bingo, and Draft Economy.
website: https://willy-money-smp-web.vercel.app/

commands:
  smp:
    description: Open the SMP Admin Control Panel GUI or manage phases
    permission: moneysmp.admin
  team:
    description: Manage Willy Money SMP Teams
  tier:
    description: Assign or remove player tiers
    permission: moneysmp.admin
  bid:
    description: "Bid on the player up for auction (+5 each time). Admins use /bid nominate <player>"
  tc:
    description: Send a private message to your team
    aliases: [teamchat]
  announce:
    description: Broadcast a server announcement with sound
    aliases: [broadcast, alert]
    permission: moneysmp.admin
  titleannounce:
    description: Fullscreen title announcement
    permission: moneysmp.admin
  fine:
    description: "Fine a player or team: /fine <player|team> <amount> <reason>, /fine history, /fine undo"
    permission: moneysmp.admin
  cp:
    description: "Capture points: set, startday, list, open, stopday, remove"
    aliases: [capture, capturepoint]
    permission: moneysmp.admin
  freefall:
    description: "Optional shrinking world border to push teams together (start, center, status, stop, end, reset)"
    permission: moneysmp.admin
  ffa:
    description: "FINAL FIGHT - Team Deathmatch: last team standing wins, bounty tier glows, then the tournament winner is crowned (start, status, out, end, stop)"
    aliases: [tdm, deathmatch]
    permission: moneysmp.admin
  bingo:
    description: Open the interactive 5x5 Lockout Bingo board GUI
  credits:
    description: Admin commands to manage draft and game credits
    permission: moneysmp.admin
  leaderboard:
    description: View the tournament leaderboard
    aliases: [top]
  website:
    description: Get a clickable link to the live standings website
    aliases: [site, web]
  banneditems:
    description: View and manage banned tournament items and restrictions
    aliases: [banned, banlist, bannedlist]
  rank:
    description: "Ops/console only: set a staff rank (/rank set <player> owner|admin|none, /rank list)"

permissions:
  moneysmp.admin:
    description: "Admin: run events, the draft, fines, subs, teams, tiers and credits"
    default: op
  moneysmp.owner:
    description: "Owner: everything an admin can do, plus reset data and change config"
    default: op
    children:
      moneysmp.admin: true
